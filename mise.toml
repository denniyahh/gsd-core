[tools]
node = "24"

[tasks."ci:mac"]
description = "Run full CI suite remotely on Mac"
run = "./scratch/ci-mac.sh"

[tasks."check:mac"]
description = "Check environment and build remotely on Mac"
run = "./scratch/ci-mac.sh npm run check:env && ./scratch/ci-mac.sh npm run build:lib"

[tasks."test:mac"]
description = "Run focused test file(s) or suite remotely on Mac"
run = "./scratch/test-mac.sh"

[tasks."test:focus"]
description = "Run focused test file(s) remotely on Mac"
run = "./scratch/test-mac.sh"

[tasks."test:all:mac"]
description = "Run full 43-chunk test suite remotely on Mac (takes ~2h; use test:mac for iteration)"
run = "./scratch/ci-mac.sh npm test"

[tasks."check:budget"]
description = "Verify workflow byte budgets (ADR-857 Phase 6 ceilings) and drift acks"
run = "./scratch/check-workflow-budgets.sh"

[tasks."check:boundary"]
description = "Verify contribution boundary clean (no personal workflow files in PR diff)"
run = "./scratch/check-publish-boundary.sh"

[tasks.check]
description = "Pre-flight CI checks (routed to Mac runner with budget check)"
run = "./scratch/check-workflow-budgets.sh && ./scratch/ci-mac.sh"

[tasks.sync]
description = "Sync with upstream/next and prune completed PR worktrees"
run = "git fetch upstream next && git merge upstream/next && ./scratch/prune-completed-worktrees.sh"

[tasks."start:wt"]
description = "Create a new isolated task worktree with Mac CI runner capabilities inherited"
run = "./scratch/new-worktree.sh"

[tasks."start:task"]
description = "Alias for start:wt — start a new task worktree"
run = "./scratch/new-worktree.sh"

[tasks."resume:task"]
description = "Resume work on active task: check hygiene, upstream drift, runner health, and sync personal env"
run = "./scratch/resume-task.sh"

[tasks."ready:pr"]
description = "Run pre-PR quality gates: boundary check, budget check, changeset validation, full Mac CI, and push"
run = "./scratch/ready-pr.sh"

[tasks."sync:env"]
description = "Pull latest personal environment (.planning, scratch, .agents) from personal workspace"
run = "./scratch/sync-personal-env.sh pull"

[tasks."push:env"]
description = "Reconcile worktree .planning and scratch changes back to personal workspace"
run = "./scratch/sync-personal-env.sh push"

[tasks.pr]
description = "Pre-PR verification and submission workflow"
run = "./scratch/ready-pr.sh"

[tasks."pr:feedback"]
description = "Check GitHub notifications stream for maintainer feedback and stage remediation context"
run = "node scratch/pr-feedback-consumer.cjs --once"

[tasks."pr:watch"]
description = "Watch GitHub notifications stream continuously for maintainer feedback"
run = "node scratch/pr-feedback-consumer.cjs --watch"

[tasks."pr:status"]
description = "Scan all open PRs for maintainer reviews, upstream drift, and CI check statuses"
run = "./scratch/check-pr-feedback.sh"

[tasks."prune:completed"]
description = "Discover and automatically prune worktrees and branches for merged or closed PRs"
run = "./scratch/prune-completed-worktrees.sh"

[tasks."prune:wt"]
description = "Alias for prune:completed — prune completed PR worktrees"
run = "./scratch/prune-completed-worktrees.sh"

[tasks."pr:monitor:status"]
description = "Check systemd PR feedback and CI status background monitor timer and service"
run = "systemctl --user status gsd-pr-monitor.timer gsd-pr-monitor.service || true"

[tasks."pr:monitor:logs"]
description = "View real-time journal logs from automated PR feedback and CI status monitor"
run = "journalctl --user -u gsd-pr-monitor.service -n 50 --no-pager"

[tasks."pr:monitor:restart"]
description = "Restart the systemd PR feedback and CI status background monitor"
run = "systemctl --user daemon-reload && systemctl --user restart gsd-pr-monitor.timer gsd-pr-monitor.service"


